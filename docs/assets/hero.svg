<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">CareConnect AI</title>
  <desc id="d">Intelligent Blood Management and Emergency Coordination</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0C"/>
      <stop offset="1" stop-color="#190A0E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="20" fill="none" stroke="#2A2A2E"/>

  <!-- status indicator -->
  <circle cx="56" cy="52" r="5" fill="#E0253F"/>
  <circle cx="56" cy="52" r="5" fill="none" stroke="#E0253F" stroke-width="1.5">
    <animate attributeName="r" values="5;15" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="76" y="57" fill="#9A9AA0" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3">ACTIVE DEVELOPMENT</text>

  <!-- title -->
  <text x="600" y="168" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="9">CARECONNECT <tspan fill="#E0253F">AI</tspan></text>
  <text x="600" y="214" text-anchor="middle" fill="#D4D4D8" font-family="Helvetica, Arial, sans-serif" font-size="22" letter-spacing="1">Intelligent Blood Management &amp; Emergency Coordination</text>

  <!-- heartbeat line -->
  <path d="M40,285 H430 L450,285 L470,255 L492,310 L520,225 L550,330 L575,285 H760 L780,285 L796,268 L812,300 L832,285 H1160"
        fill="none" stroke="#2B2B30" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M40,285 H430 L450,285 L470,255 L492,310 L520,225 L550,330 L575,285 H760 L780,285 L796,268 L812,300 L832,285 H1160"
        pathLength="1000" fill="none" stroke="#E0253F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
        stroke-dasharray="140 1000" stroke-dashoffset="140">
    <animate attributeName="stroke-dashoffset" values="140;-1000" dur="4s" repeatCount="indefinite"/>
  </path>

  <text x="600" y="342" text-anchor="middle" fill="#6B6B73" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="4">UNDERSTAND · MATCH · RESPOND · MANAGE · PREDICT · COORDINATE</text>
</svg>
