<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 200" width="1260" height="200" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Hospital, emergency request, AI processing, compatible donors, emergency alert, donor response</title>

  <rect width="1260" height="200" rx="16" fill="#0B0B0C"/>
  <rect x="0.5" y="0.5" width="1259" height="199" rx="16" fill="none" stroke="#2A2A2E"/>

  <!-- track -->
  <line x1="20" y1="100" x2="1240" y2="100" stroke="#2E2E33" stroke-width="2"/>

  <!-- arrows -->
  <g fill="#6B6B73">
    <polygon points="200,94 210,100 200,106"/>
    <polygon points="414,94 424,100 414,106"/>
    <polygon points="628,94 638,100 628,106"/>
    <polygon points="842,94 852,100 842,106"/>
    <polygon points="1056,94 1066,100 1056,106"/>
  </g>

  <!-- nodes -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="56" width="150" height="88" rx="12" fill="#111113" stroke="#2E2E33"/>
    <text x="95" y="80" fill="#E0253F" font-size="11" letter-spacing="2">01</text>
    <text x="95" y="108" fill="#FFFFFF" font-size="14" font-weight="600" letter-spacing="1">HOSPITAL</text>

    <rect x="234" y="56" width="150" height="88" rx="12" fill="#111113" stroke="#2E2E33"/>
    <text x="309" y="80" fill="#E0253F" font-size="11" letter-spacing="2">02</text>
    <text x="309" y="102" fill="#FFFFFF" font-size="14" font-weight="600" letter-spacing="1">EMERGENCY</text>
    <text x="309" y="120" fill="#FFFFFF" font-size="14" font-weight="600" letter-spacing="1">REQUEST</text>

    <rect x="448" y="56" width="150" height="88" rx="12" fill="#111113" stroke="#2E2E33"/>
    <text x="523" y="80" fill="#E0253F" font-size="11" letter-spacing="2">03</text>
    <text x="523" y="102" fill="#FFFFFF" font-size="14" font-weight="600" letter-spacing="1">AI</text>
    <text x="523" y="120" fill="#FFFFFF" font-size="14" font-weight="600" letter-spacing="1">PROCESSING</text>

    <rect x="662" y="56" width="150" height="88" rx="12" fill="#111113" stroke="#2E2E33"/>
    <text x="737" y="80" fill="#E0253F" font-size="11" letter-spacing="2">04</text>
    <text x="737" y="102" fill="#FFFFFF" font-size="14" font-weight="600" letter-spacing="1">COMPATIBLE</text>
    <text x="737" y="120" fill="#FFFFFF" font-size="14" font-weight="600" letter-spacing="1">DONORS</text>

    <rect x="876" y="56" width="150" height="88" rx="12" fill="#B3122A" stroke="#E0253F"/>
    <text x="951" y="80" fill="#FFD9DE" font-size="11" letter-spacing="2">05</text>
    <text x="951" y="102" fill="#FFFFFF" font-size="14" font-weight="600" letter-spacing="1">EMERGENCY</text>
    <text x="951" y="120" fill="#FFFFFF" font-size="14" font-weight="600" letter-spacing="1">ALERT</text>

    <rect x="1090" y="56" width="150" height="88" rx="12" fill="#111113" stroke="#2E2E33"/>
    <text x="1165" y="80" fill="#E0253F" font-size="11" letter-spacing="2">06</text>
    <text x="1165" y="102" fill="#FFFFFF" font-size="14" font-weight="600" letter-spacing="1">DONOR</text>
    <text x="1165" y="120" fill="#FFFFFF" font-size="14" font-weight="600" letter-spacing="1">RESPONSE</text>
  </g>

  <!-- moving pulses -->
  <circle r="5" fill="#E0253F" cy="0" cx="0">
    <animateMotion path="M20,100 H1240" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#E0253F" cy="0" cx="0">
    <animateMotion path="M20,100 H1240" dur="6s" begin="3s" repeatCount="indefinite"/>
  </circle>
